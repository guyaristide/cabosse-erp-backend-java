{#include mail/layout/base.html}
{#title}{t.title}{/title}

<h1 style="margin:0 0 16px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:22px;font-weight:600;letter-spacing:-0.02em;color:#1a1a1a;">
  {t.heading}
</h1>

<p style="margin:0 0 16px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:14px;line-height:1.55;color:#404040;">
  {t.intro}
</p>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:0 0 24px 0;border:1px solid #f0efeb;border-radius:6px;">
  <tr>
    <td style="padding:16px 20px;">
      <p style="margin:0 0 6px 0;font-family:'SF Mono','Courier New',monospace;font-size:12px;color:#8a8a8a;">
        {ticketRef}
      </p>
      <p style="margin:0 0 12px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:15px;font-weight:600;color:#1a1a1a;">
        {subject}
      </p>
      <p style="margin:0;white-space:pre-wrap;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:14px;line-height:1.55;color:#404040;">
        {body}
      </p>
    </td>
  </tr>
</table>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 24px 0;">
  <tr>
    <td style="background-color:#1a1a1a;border-radius:6px;">
      <a href="{ticketUrl}" style="display:inline-block;padding:12px 24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:14px;font-weight:500;color:#ffffff;text-decoration:none;">
        {t.cta}
      </a>
    </td>
  </tr>
</table>

<p style="margin:0 0 8px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:13px;color:#6b6b6b;">
  {t.fallbackHint}
</p>

<p style="margin:0 0 24px 0;word-break:break-all;font-family:'SF Mono','Courier New',monospace;font-size:12px;color:#6b6b6b;">
  {ticketUrl}
</p>

<p style="margin:0;padding-top:16px;border-top:1px solid #f0efeb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:12px;color:#8a8a8a;">
  {t.noReply}
</p>
{/include}
