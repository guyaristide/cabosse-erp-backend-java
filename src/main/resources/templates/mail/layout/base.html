<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="{t.lang ?: 'fr'}">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{#insert title}Cabosse ERP{/}</title>
</head>
<body style="margin:0;padding:0;background-color:#faf7f2;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;color:#1c1712;line-height:1.5;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#faf7f2;">
    <tr>
      <td align="center" style="padding:32px 16px;">

        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:520px;width:520px;">
          <!-- Brand -->
          <tr>
            <!--
              Le lockup de la charte, reproduit en texte et non en image :
              les clients de messagerie bloquent les images distantes par
              défaut, et une marque qui ne s'affiche pas vaut moins qu'une
              marque écrite. La goutte or au-dessus du « o » ne se rend pas
              sans image, elle n'est donc pas tentée.
            -->
            <td style="padding-bottom:24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:19px;font-weight:600;letter-spacing:-0.02em;color:#1c1712;">
              Cabosse<span style="color:#d6a24a;">&nbsp;ERP</span>
            </td>
          </tr>

          <!-- Card -->
          <tr>
            <td style="padding:0;background-color:#ffffff;border:1px solid #e2d8ca;border-radius:12px;">
              <div style="padding:32px;">
                {#insert /}
              </div>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding-top:24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.12em;color:#948877;">
              {t.footer ?: 'Cabosse ERP'}
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>
</body>
</html>
