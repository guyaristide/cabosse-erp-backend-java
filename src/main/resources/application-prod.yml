# ────────────────────────────────────────────────────────────────────────
#  Prod — Cabosse ERP
#
#  Toutes les valeurs sensibles viennent de Vault / variables d'env.
#  Aucune origine CORS wildcard tolérée (cf. CLAUDE.md §2.5).
# ────────────────────────────────────────────────────────────────────────

quarkus:
  # Le schéma était public : il cartographiait toute l'API sans jeton
  # (relevé le 27/09/2026). Le client TypeScript du front se génère
  # depuis un environnement de développement, pas depuis la production.
  smallrye-openapi:
    enable: false

  log:
    level: INFO
    category:
      "com.ntech.cabosse":
        level: INFO

  http:
    cors:
      enabled: true
      # Liste blanche stricte, plus les postes de développement.
      #
      # Le serveur en ligne renvoyait n'importe quelle origine, y compris
      # une origine pirate : la liste n'était pas appliquée (relevé le
      # 27/09/2026). Elle l'est ici, et les ports locaux passent par une
      # expression régulière plutôt que par un caractère générique, pour
      # que « localhost » reste la seule exception.
      #
      # L'authentification est par jeton porté en en-tête, non par
      # cookie, et les requêtes n'emportent pas d'identifiants : une page
      # servie depuis un poste local ne peut pas rejouer la session de
      # quelqu'un d'autre. C'est ce qui rend cette exception tenable.
      # L'adresse du site vient du déploiement : elle change d'une
      # installation à l'autre, la figer ici ferait payer chaque nouveau
      # domaine. Les postes locaux, eux, sont une constante de
      # l'outillage et restent écrits ici.
      #
      # CORS_ORIGINS était définie vide au déploiement : tant que la
      # liste ne contenait qu'elle, elle était vide, et une liste vide ne
      # restreint rien — c'est ce qui laissait passer n'importe quelle
      # origine. Y ajouter les postes locaux a rendu la liste non vide,
      # donc appliquée, et l'adresse du site n'y figurait pas : toute
      # l'application a répondu 403 le 28/09/2026. Les deux états sont
      # mauvais et aucun ne se voyait, d'où CorsOriginsCheck, qui arrête
      # le démarrage quand la liste ne désigne aucun site.
      #
      # Les antislashs sont doublés : dans une liste de configuration,
      # l'antislash échappe le caractère suivant, et « \d » arriverait au
      # moteur d'expressions sous la forme « d ».
      origins: ${CORS_ORIGINS:},/https?://localhost(:\\d+)?/,/https?://127\\.0\\.0\\.1(:\\d+)?/
      access-control-allow-credentials: false
      methods: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
      # Idempotency-Key voyage sur les flux d'argent (reçu d'achat,
      # règlement producteur) : sans elle dans cette liste, le
      # navigateur refuse la requête au preflight et la saisie échoue
      # sur « réseau indisponible », alors que le réseau va bien.
      # X-Platform-Restore-Secret porte le secret de remontée du serveur :
      # même piège, et il ne se voit qu'en navigateur (relevé le
      # 23/09/2026, la restauration échouait sans rien atteindre).
      headers: "Content-Type,Authorization,Idempotency-Key,X-Platform-Restore-Secret"

    # ── En-têtes de sécurité (relevé du 27/09/2026 : il n'y en avait aucun) ──
    # Posés par le serveur et non par le proxy : ils suivent
    # l'application partout où elle est déployée. Quarkus attend une
    # table nommée par en-tête, pas une liste.
    header:
      # L'API ne rend que du JSON : sans cela un navigateur peut décider
      # d'interpréter une réponse autrement que son type déclaré.
      "X-Content-Type-Options":
        value: nosniff
      # Une réponse d'API n'a aucune raison d'être encadrée ailleurs.
      "X-Frame-Options":
        value: DENY
      # Une adresse de ressource porte souvent un identifiant : elle ne
      # part pas vers un site tiers.
      "Referrer-Policy":
        value: no-referrer
      # Le proxy force déjà HTTPS ; cet en-tête couvre la toute première
      # requête, celle qui précède toute redirection.
      "Strict-Transport-Security":
        value: "max-age=31536000; includeSubDomains"

  mongodb:
    connection-string: ${MONGO_URI}

  mailer:
    # Tous les secrets viennent de Vault / env d'orchestration en prod.
    # Aucune valeur par défaut — démarrage refusé si l'une manque.
    from: ${MAILER_FROM}
    host: ${MAILER_HOST}
    port: ${MAILER_PORT:587}
    start-tls: ${MAILER_STARTTLS:REQUIRED}
    username: ${MAILER_USERNAME}
    password: ${MAILER_PASSWORD}

mp:
  jwt:
    verify:
      publickey:
        location: ${JWT_PUBLIC_KEY_LOCATION}
      issuer: ${JWT_ISSUER}

smallrye:
  jwt:
    sign:
      key:
        location: ${JWT_PRIVATE_KEY_LOCATION}

application:
  # URL publique du front (utilisée pour générer les liens d'activation
  # dans les mails d'invitation). Strict : démarrage refusé si manquante,
  # comme MAILER_FROM / APP_BASE_URL.
  frontend-base-url: ${FRONTEND_BASE_URL}

  # En prod la cible est S3 ; on garde "local" disponible en fallback contrôlé.
  file-storage:
    backend: ${FILE_STORAGE_BACKEND:s3}
    local:
      base-path: ${FILES_BASE_PATH:/var/cabosse/uploads}
      public-base-url: ${APP_BASE_URL}/api/v1/files
    s3:
      bucket: ${S3_BUCKET}
      region: ${S3_REGION:eu-west-3}
      endpoint: ${S3_ENDPOINT:}
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
      public-cdn-domain: ${S3_PUBLIC_DOMAIN:}
      presigned-url-ttl: PT1H

  # Bootstrap du premier admin : env vars exigées au premier déploiement,
  # à retirer après. Si vides et aucun admin n'existe → l'app refuse de
  # démarrer (cf. PlatformAdminBootstrap).
  bootstrap:
    platform-admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
